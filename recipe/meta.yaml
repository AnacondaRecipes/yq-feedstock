{% set name = "yq" %}
{% set version = "4.4.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: e17b21a927d04ae33f61a7284351b69b0a539bfb73b852a04a907b79bcd15de2

build:
  number: 0
  entry_points:
    - yq=yq:cli
    - xq=yq:xq_cli
    - tomlq=yq:tq_cli
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: True  # [py<38]

requirements:
  host:
    - pip
    - python
    - hatchling
    - hatch-vcs
  run:
    - python
    - pyyaml >=5.3.1
    - xmltodict >=0.11.0
    - tomlkit >=0.11.6
    - argcomplete >=1.8.1
    # yq shells out to the jq binary; not a pyproject dependency.
    - jq

{% set deselect_tests = "" %}
# PBP Linux workers do not expose symbolic /proc/<pid>/wchan (pipe_read/pipe_write),
# so test_interrupt_reaps_jq never observes the expected block.
{% set deselect_tests = deselect_tests + " --deselect=test/test.py::TestYq::test_interrupt_reaps_jq" %}
{% set deselect_tests = deselect_tests + " --deselect=test/test.py::TestYqLibYaml::test_interrupt_reaps_jq" %}

test:
  source_files:
    - test
  imports:
    - yq
  commands:
    - pip check
    - yq --help
    - xq --help
    - tomlq --help
    # Windows error: E   AttributeError: module 'os' has no attribute 'EX_OK'
    - pytest -vv test/test.py {{ deselect_tests }}  # [not win]
  requires:
    - pip
    - pytest
    # Quote-style roundtrip needs tomlkit >=0.14; upstream still allows >=0.11.6.
    - tomlkit >=0.14.0

about:
  home: https://github.com/kislyuk/yq
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: Command-line YAML/XML processor - jq wrapper for YAML/XML documents
  description: |
    yq: Command-line YAML/XML/TOML processor - jq wrapper for YAML, XML, TOML documents
  doc_url: https://kislyuk.github.io/yq
  dev_url: https://github.com/kislyuk/yq

extra:
  recipe-maintainers:
    - sodre
    - xhochy
