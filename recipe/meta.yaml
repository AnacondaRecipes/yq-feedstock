{% set name = "yq" %}
{% set version = "3.4.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: ba586a1a6f30cf705b2f92206712df2281cd320280210e7b7b80adcb8f256e3b

build:
  number: 0
  entry_points:
    - yq=yq:cli
    - xq=yq:xq_cli
    - tomlq=yq:tq_cli
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: True  # [py<38]

requirements:
  host:
    - pip
    - python
    - wheel
    - setuptools
    - setuptools_scm >=7
  run:
    - python
    - pyyaml >=5.3.1
    - xmltodict >=0.11.0
    - tomlkit >=0.11.6
    - argcomplete >=1.8.1

test:
  source_files:
    - test
  imports:
    - yq
  commands:
    - pip check
    - yq --help
    - xq --help
    - tomlq --help
    - pytest -v test/test.py
  requires:
    - pip
    - pytest
    - jq

about:
  home: https://github.com/kislyuk/yq
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: Command-line YAML/XML processor - jq wrapper for YAML/XML documents
  description: |
    yq: Command-line YAML/XML/TOML processor - jq wrapper for YAML, XML, TOML documents
  doc_url: https://kislyuk.github.io/yq
  dev_url: https://github.com/kislyuk/yq

extra:
  recipe-maintainers:
    - sodre
    - xhochy
